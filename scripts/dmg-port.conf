# QuakeSpasm's config for the shared deploy-dmg.sh / smoke-dmg.sh
# (old-mac-build-host#96). This file is ours and is never synced; the two
# scripts are buildhost's and are synced byte-identical. Variables are
# documented at the top of both scripts.

PORT=quakespasm
DMG_PREFIX=QuakeSpasm-OldMac-
IMAGE_ROOT=Quakespasm
INSTALL_DIR=/Applications/QuakeSpasm

# The DMG's Quakespasm/ folder: the app, the engine's own pak, and the helper.
OWNED=(Quakespasm.app quakespasm.pak 'Fix Launch Problems.command?')
VERIFY=(Quakespasm.app/Contents/MacOS/quakespasm quakespasm.pak)

# id1/ holds the player's paks, saves and config: never touched. A first
# install seeds it from the legacy dev-install location (copy only).
DATA_DIR=id1
FIRST_SEED=('~/Desktop/quake/id1')

# Smoke: a production launch that auto-exits via timedemo (smoke-dmg.sh #45).
PROC=quakespasm
SMOKE_ARGS=(-nolauncher -basedir . -nosound -condebug +timedemo '{DEMO}')
SMOKE_DEMO=demo1
SMOKE_LOG=qconsole.log
PASS_RE='frames.*seconds.*fps'
FAIL_RE='Quake Error|Host_Error|Sys_Error'
# TERM, grace, then KILL is fine (ADR 0007 forbids only a straight KILL).
KILL_OK=yes
# demo1 end to end, measured 2026-09-23: G3/Panther 103.5 s cold,
# G4 ~20 s, G5 ~12 s, Intel 4.5-20 s.
SMOKE_TIMEOUT_ppc750=240
SMOKE_TIMEOUT_ppc7400=180
SMOKE_TIMEOUT_ppc7450=180
SMOKE_TIMEOUT_ppc970=120
SMOKE_TIMEOUT=60
