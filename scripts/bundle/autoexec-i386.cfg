// i386 (32-bit-only Intel) -- 10.4 Tiger through 10.6.8 Snow Leopard.
// Loaded automatically by host.c's per-arch engine hook AFTER quake.rc.
//
// IMPORTANT: avoid `;` in comments -- Quake's Cbuf_Execute splits on \n
// OR `;` (cmd.c:162), so a stray semicolon mid-comment splits the line
// and what follows is parsed as a fresh command.
//
// This slice exists for exactly four machines, the only Intel Macs with no
// 64-bit mode: Mac mini 1,1, iMac 4,1, MacBook 1,1 and MacBook Pro 1,1, all
// 2006 Core Solo / Core Duo. dyld grades by CPU subtype alone, so without
// this slice those machines are handed nothing at all and the app will not
// launch. There is no lower Intel slice to fall back to.
//
// NOT BENCHED: there is no such machine in the fleet. Every value below is
// set from the hardware's documented capability, not from measurement, and
// is deliberately conservative. Treat the numbers as a starting point.
// The GPU is a GMA 950 in every one of those models, the same part as
// mini-intel, so autoexec-mini-intel.cfg is the closest measured reference.

// ---------------------------------------------------------------
// Display: 800x600 fullscreen.
//
// Lower than the x86_64 slice's 1024x768 on purpose. The GMA 950 has no
// hardware T&L and is fillrate-bound, and a Core Solo has half the CPU of
// the Core 2 Duo that was measured at ~96 fps at 1024x768. 800x600 keeps
// the weakest of these machines above the 60 fps floor.
vid_width 800
vid_height 600
vid_fullscreen 1
// ---------------------------------------------------------------

// r_oldwater 1 -- GMA 950 reports GL 1.4 with no GLSL, so the new-water
// shader path is unavailable and would fall back anyway. Explicit.
r_oldwater 1

// Off: costs per-frame CPU work on a chip that has little to spare.
r_lerplightstyles 0

// The engine clamps silently to GL_MAX_TEXTURE_MAX_ANISOTROPY_EXT.
gl_texture_anisotropy 16

// r_shadows 0 -- the alias drop-shadow is an extra per-model pass, and on
// a fillrate-bound GMA 950 driven by a single core that is the first thing
// to give up. The x86_64 slice keeps it because a Core 2 Duo absorbs it.
r_shadows 0

gl_texturemode "GL_LINEAR_MIPMAP_LINEAR"
gl_texture_lodbias 0

// ---------------------------------------------------------------
// Engine timing: keep the demo loop at the recorded speed.
host_maxfps 72
host_framerate 0
host_timescale 0
// ---------------------------------------------------------------

// Audio baselines, in case a stale config.cfg zeroed one.
volume 0.7
bgmvolume 1.0
// ---------------------------------------------------------------

// Apply the resolution change.
vid_restart

// ---------------------------------------------------------------
// Default controls, matching the rest of the fleet.
bind LEFTARROW +moveleft
bind RIGHTARROW +moveright
bind a +moveleft
bind d +moveright
bind F12 screenshot_desktop
+mlook

gl_aliasstate_cache 1
// ---------------------------------------------------------------

// --- Apple Watch tactical computer (watchlink) ----------------------
// See autoexec-x86_64.cfg for the rationale.
watch_host "auto"
watch_port "27999"
