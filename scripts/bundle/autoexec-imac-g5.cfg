// iMac G5 (PowerMac8,2 -- 2.0 GHz ppc970, ATI Radeon 9600 / 128 MB,
// Leopard 10.5.8) -- per-MACHINE overlay. Layered on top of
// autoexec-ppc970.cfg (the per-arch G5 baseline) by host.c via sysctl
// hw.model, and by bench.sh / deploy.sh which concatenate arch-cfg +
// this file. So this is a DELTA over the ppc970 baseline.
//
// IMPORTANT: avoid `;` in comments -- Cbuf_Execute splits on \n OR `;`
// (cmd.c:162), so a stray semicolon mid-comment starts a fresh command.
//
// ===================================================================
// WHY THIS MACHINE IS SPECIAL (read before touching GL settings):
// The Radeon 9600 (R300 family) is the ONLY GPU in the fleet that
// advertises OpenGL 2.0, so it is the only one that would run
// QuakeSpasm's GLSL + VBO path. That path HARD-HANGS the R300's Mac GL2
// driver on Leopard -- GPU lock, whole OS down, fans to max (cf.
// QuakeSpasm bug #43, and MISTAKES.md). The engine now force-disables
// GLSL/VBO/NPOT/warp-mipmaps on this renderer (the ATI R300 gate in
// gl_vidsdl.c GL_CheckExtensions) so the G5 runs the SAME GL 1.x
// fixed-function path the GL-1.3 G4s run rock-solid. Result: stable +
// ~119 fps at native 1440x900 fullscreen 32bpp. Override for A/B with
// the -atigl launch flag (re-enables the GL2 path -- expect a wedge).
//
// ===================================================================

// Display: native-resolution desktop-fullscreen now comes from the
// ppc970 baseline (vid_desktopfullscreen 1 -- applies to every G5 so any
// R300 tower is protected from a mode-switch too). Nothing to set here.
// ===================================================================

// --- Visual deltas over the ppc970 baseline. All GL 1.x fixed-function
// --- (proven on the G4 Radeon 9000/9200), so safe on the R300 too. The
// --- 2 GHz G5 + Radeon 9600 has ample headroom (119 fps native). -------

// Smooth 10 Hz lightstyle interpolation (torches/pulsing lights ramp
// instead of stepping). Baseline ships 0 to match the G4 floor.
r_lerplightstyles 1

// Plain water translucency (fixed-function new-water, r_oldwater 0 from
// the baseline -- the engine-side two-pass split keeps it correct).
r_wateralpha 0.6

// Emissive-fullbright lights: surfaces with emissive textures
// (light/button/comp/tech/panel/screen) cast coloured light on nearby
// geometry. Fixed-function blend passes -- Radeon 9600 has the fillrate.
r_emissive_lights         1
r_emissive_lights_radius  1.0
r_emissive_lights_max     12

// Emissive-texel black flicker fix (2026-06-06). QuakeSpasm draws self-lit
// texels (light/lava/tech-panel) by blacking them out of the base texture and
// adding them back in a SECOND additive geometry pass (R_DrawTextureChains_Glow).
// On ATI fixed-function the additive pass and base pass submit bit-identical
// vertices, but the depth comparator rejects the equal-Z coincident fragments
// at grazing/far angles, so the glow drops out and the texels flash BLACK.
// We USED to disable the whole pass here (gl_fullbrights 0) -- correct but it
// killed the glow. Now we keep the glow and bias the additive pass toward the
// camera so GL_LEQUAL always passes. This was wrongly assumed R300-only; the
// mini-g4 Radeon 9200 (R200) shows it too, so it's a general ATI fix.
// 1 unit is enough on the G5's 24-bit depth; bump if any flicker survives.
gl_fullbright_zbias 1

// Skip the redundant per-frame backbuffer clear (world+sky cover the
// screen). Engine default is already 0 -- explicit to guard a stale cfg.
gl_clear 0

// Classic full-width HUD strip for manual .app launches.
viewsize 100

// --- Apple Watch tactical computer (watchlink) ----------------------
// Auto-discover the iPhone companion over Bonjour (_q2watch._udp) and
// stream live player state to the wrist. Off-fleet default is "" (inert)
// -- enabled here for the watch-companion setup. See docs/WATCHLINK.md.
// NB: QuakeSpasm has no "set" command — assign the cvar bare, like the lines above.
watch_host "auto"
