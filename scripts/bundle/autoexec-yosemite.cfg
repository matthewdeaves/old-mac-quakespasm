// G3 cvar tuning — managed by scripts/deploy.sh

// gl_texture_anisotropy 2 — Q2-borrow round. Rage 128's chip-max AF level
// is 2× (the GPU is fixed-function 1999 silicon, no ARB_filter_anisotropic).
// Engine clamps silently if the driver doesn't expose the extension, so
// setting it is either a free visual quality win (sharper receding floors
// and walls) or a no-op. Q2 confirmed safe on R128 (commit d82d3fa).
gl_texture_anisotropy 2

// r_oldwater 1 = always classic warped water. Phase 0 used 2 (auto:
// classic above 640x480, new at/below) because the demo1 640 numbers
// showed neither path winning on perf (-0.8%, noise). But interactive
// play at 640 surfaced what we missed: the Rage 128 framebuffer-copy
// refraction tint bug fires at 640 too — water flickers bright blue.
// Fix is to never use new water on G3: classic warp is correct at
// every resolution, costs nothing extra, and tessellated UV
// displacement looks fine on R128.
r_oldwater 1

// r_particles 2 = square particles (CPU-cheaper than triangle splats).
// Phase 0 measurement: helps slightly on R128, no visual difference at
// distance.
r_particles 2

// gl_subdivide_size 256 (default 128) — coarser tessellation of warp
// (sky/water) surfaces. ~4× fewer triangles per warp surface, which
// matters on R128 because the chip is per-vertex-cost-sensitive (1999
// silicon). Visual: warp distortion is still per-vertex-screen-space,
// so coarser mesh shouldn't change apparent water motion. PPC_PLAN.md
// §13.5 predicted +1-3% on G3 — every fps counts at the 20 fps floor
// the user wants for 1024×768 play.
gl_subdivide_size 256

// r_shadows 1 — alias drop-shadow trial on G3 per user request
// 2026-05-08. G4 saw -11% from this -- on G3 with demo1 1024 already
// at ~25 fps, that math takes us to ~22 fps which is right at the
// 20 fps playability floor. We benchmark this to see if the actual
// cost is the same on Rage 128 (different cost profile from R9000)
// or breaks the 20 fps floor on demo3 specifically. If demo3 1024
// drops below 20, this gets reverted.
r_shadows 1

// Pass B revive B3 (§14.3 follow-up).
//
// gl_flashblend 1 was tried (Pass B prediction: +2-5% on demo3 1024
// from skipping per-light lightmap re-touch in favour of a billboard
// glow sprite). Reproducibly **crashed quakespasm on G3** at the
// dlight-heavy point of demo3 1024 across two attempts. R128 driver
// can't handle whatever path the billboard glow flows through.
// **Don't enable on G3.** Documented under "Won't-do" rather than
// shipped, since the crash is deterministic.
//
// gl_zfix 1 — z-fighting fix for coincident surfaces. Some Quake 1
// custom maps have these (decals, signs over walls, intersecting
// brushes). Engine-wide cost is negligible if no surfaces actually
// fight, so default-on and trust the fast path when no map needs it.
gl_zfix 1

// r_dynamic_distance 768 — Round v5 B1, headline G3 lever. R128 has
// no fragment-shader dynamic-light path, so each dlight that reaches
// R_MarkLights triggers a BSP recursion AND a surface-reblend GPU
// pass per touched face (the GPU-bound regime that limits G3
// framerate). Skipping dlights past 768 units removes both costs for
// lights that are far enough away that their on-screen contribution
// is barely perceptible. Engine default 0 = unlimited (upstream
// parity) -- G4/G4mini/Lion left at 0 -- they have headroom. Bench the
// expected +5-15% on demo3 (dlight-heavy) -- demo1/demo2 should be
// neutral (sparse dlights). Toggleable: set 0 to revert.
r_dynamic_distance 768

// Round v5 wrap visual polish (2026-05-09): translucent liquid
// surfaces (lava / teleporters / slime). Subtle see-through showing
// volume underneath.
//
// Round v8 followup (2026-05-10): bisect on yosemite demo3 1024 (e1m6
// "The Door To Chthon", lava-heavy) showed `r_lavaalpha 0.6` alone
// drops fps from 19.65 → 14.40 (-26 %), pushing G3 below the 20-fps
// playability floor. The Rage 128 is a fixed-function 1999 GPU -- every
// alpha-blended surface costs a full fillrate-bound RMW per touched
// pixel, and lava-heavy scenes have many large lava polys on screen at
// once. Tele + slime alpha together also showed regression on the same
// bisect (bisect via id1/autoexec edits + reboot between cells).
//
// Decision: drop lava/tele/slime alpha on G3, keep `r_wateralpha 0.6`
// (water see-through is the most-common transparent-liquid effect in
// regular play and was already in baseline at 0.6). G4 trio + Lion +
// iMac keep all four liquid alphas (different fillrate envelope).
//
// Possible follow-up round: add `r_lavaalpha_distance` (mirroring
// r_dynamic_distance) so close-up lava can blend while far-field lava
// stays opaque, recovering the visual without the full-scene fillrate
// cost. Worth ~1 round of code work -- defer until plan revisit.
//r_lavaalpha 0.6
//r_telealpha 0.6
//r_slimealpha 0.6

// Round v5 wrap pass 2 (2026-05-09): plain water translucency. See
// the underwater geometry through the surface. Goes through the
// classic-warp DrawWaterPoly path on R128 (r_oldwater 1 forced
// above) — alpha-blended textured warp instead of opaque write.
// Water surfaces are larger than lava/tele so cost is more visible
// than the lava alphas -- smoke confirms no demo2 (water-heavy demo)
// regression on yosemite.
r_wateralpha 0.6

// Round v5 wrap pass 3 (2026-05-09): skip backbuffer clear between
// frames. Quake's world geometry + skybox covers 100% of the screen
// in normal play, so the per-frame `glClear(GL_COLOR_BUFFER_BIT)`
// is a redundant 1024×768 fillrate-bound write. +4.7% on demo3 1024
// (20.25 → 21.20).
//
// Round v6 (2026-05-09) — engine-side water rendering split (two-
// pass) means r_wateralpha 0.6 no longer makes pool-container
// surfaces transparent. gl_clear stays at 0.
gl_clear 0

// Round v5 wrap pass 4 (2026-05-09): default video + HUD settings
// for manual launches via the .app icon. Without these, the engine
// falls back to vid_width 800 / vid_height 600 default and any
// stale viewsize from a prior session sticks. Setting them in
// PPC port -- Round v7 phase 2 (Tier A) emissive-fullbright lights.
// G3 setting under user-request bench: tight radius (0.5×) + low cap (4)
// because R128 has no fragment-shader dlight path, so each light = a
// full extra blend pass per touched surface (same regime that drove
// r_dynamic_distance 768). At demo3 1024 = 19.80 fps baseline, this is
// at the 20-fps playability floor -- bench will tell us if Tier A is
// safe to ship enabled by default on G3.
r_emissive_lights         1
r_emissive_lights_radius  0.5
r_emissive_lights_max     4

// Classic full-width HUD strip for manual .app launches.
viewsize 100

// Resolution: 800x600 fullscreen now comes from the ppc750 BASELINE,
// which applies it with a single boot vid_restart and then runs
// `vid_lock` so it can't be changed (and crash) in-game. These three
// lines just RE-ASSERT the same values into the archived cvars (no
// vid_restart here, so no mode switch) -- a guard against a stale
// config.cfg. Don't add a vid_restart below: the baseline already locked
// the mode, and a switch on the Rage 128 is the documented crash path.
// 800x600 is the Rage 128 sweet spot (more detail than 640, fps still
// above the 20-fps floor on demo3-class scenes -- user A/B 2026-05-10).
// To try another res, unlock first, one command per line:
//   vid_unlock
//   vid_width N
//   vid_height M
//   vid_restart
vid_width 800
vid_height 600
vid_fullscreen 1
