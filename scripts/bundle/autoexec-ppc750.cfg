// PPC 750 (G3, no AltiVec) -- Blue & White, iMac G3, etc. Loaded
// automatically by host.c's per-arch engine hook AFTER quake.rc.
//
// IMPORTANT: avoid `;` in comments -- Quake's Cbuf_Execute splits on \n
// OR `;` (cmd.c:162), so a stray semicolon mid-comment splits the line
// and what follows is parsed as a fresh command.
//
// Target: 10.3 Panther + Rage 128. Goal is at least 20 fps at 1024x768.

// ---------------------------------------------------------------
// Display: 1024x768 fullscreen
//
// Engine defaults are 800x600 windowed (gl_vidsdl.c:165-167). VID_Init
// runs CFG_ReadCvars before opening the GL window, so on the SECOND
// and later launches the engine boots directly at the values
// config.cfg archived. On the FIRST launch after deploy the engine
// briefly opens at 800x600 then vid_restart below flips us to 1024x768.
vid_width 1024
vid_height 768
vid_fullscreen 1
// vid_vsync left at engine default 0. Rage 128 native rate is below
// 60 fps anyway so vsync would be a no-op on G3, but skip setting it
// for consistency with the other autoexecs.
// ---------------------------------------------------------------

// Always classic warped water -- Rage 128 framebuffer-copy refraction
// path tints the water bright blue at every resolution. Classic warp
// is cheap on per-vertex sensitivity and looks fine on 1999 silicon.
r_oldwater 1

// PPC port -- finding #5: r_lerplightstyles interpolates the 10Hz
// lightstyle step so torches/pulsing lights ramp smoothly (hard
// flicker stays sharp via the engine MAXDELTA guard). G3/Rage128 stays OFF — no fillrate for per-frame lightmap rebuilds.
r_lerplightstyles 0

// Square particles -- CPU-cheaper than triangle splats with no visible
// difference at distance.
r_particles 2

// gl_subdivide_size 256 (engine default 128) -- coarser tessellation of
// warp (sky and water) surfaces. ~4x fewer triangles per warp surface,
// which matters because the chip is per-vertex-cost-sensitive. Warp
// distortion is still per-vertex-screen-space so coarser mesh does not
// change apparent water motion.
gl_subdivide_size 256

// r_shadows 1 trial on G3 (Round v3). Cost on Rage 128 differs from
// R9000. If demo3 1024 drops below 20 fps in interactive play this
// gets reverted via console.
r_shadows 1

// gl_zfix 1 -- z-fighting fix for coincident surfaces. Near-zero cost
// when no surfaces fight.
gl_zfix 1

// Round v4+ visual sharpness on G3.
//
// First attempt was gl_picmip 1 (halves texture resolutions for ~+9.8%
// fps -- 24.6 to 27.0 on demo1 1024x768) but the user judged the
// closeup texture softness too steep a trade. Reverted, picmip stays at
// engine default 0 (full resolution).
//
// Instead use gl_texture_lodbias to bias the sampler toward sharper mip
// levels at distance. R128 reports EXT_texture_lod_bias on Tiger 10.4
// (verified in qconsole boot log) so the bias actually applies. -1.5
// matches the G4 setting -- noticeably sharpens distant brick surfaces
// and signs without aliasing crawl. fps cost is negligible on Rage 128
// because LOD selection is a sampler param, not a draw cost.
gl_texture_lodbias -1.5

// ---------------------------------------------------------------
// Engine timing: keep demo loop at the recorded speed.
//
// host_maxfps caps render-frame ticking. host.c:62 default is 72.
// host_framerate / host_timescale are debug knobs that override the
// per-tick frametime -- if a stale config.cfg from a prior session has
// either set, the in-game demo loop runs sped up. Force them back to
// safe defaults here.
host_maxfps 72
host_framerate 0
host_timescale 0
// ---------------------------------------------------------------

// ---------------------------------------------------------------
// Audio. Engine defaults are sane (volume 0.7, bgmvolume 1.0) but a
// stale config.cfg may have one of these zeroed. Set explicit baselines.
volume 0.7
bgmvolume 1.0
// ---------------------------------------------------------------

// Apply the resolution change. No-op on launches where the engine
// already booted at 1024x768 from config.cfg.
vid_restart

// ---------------------------------------------------------------
// Default controls (round v4). Strafe-on-arrows + a/d, F12 saves
// screenshot to ~/Desktop/quakespasm-screenshots/, mouse look on.
// See autoexec-ppc7400.cfg for the full rationale comment block.
bind LEFTARROW +moveleft
bind RIGHTARROW +moveright
bind a +moveleft
bind d +moveright
bind F12 screenshot_desktop
+mlook
// ---------------------------------------------------------------
