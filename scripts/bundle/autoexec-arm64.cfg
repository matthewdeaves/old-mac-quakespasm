// arm64 (Apple Silicon) -- macOS 11 Big Sur and later. Loaded automatically
// by host.c's per-arch engine hook AFTER quake.rc.
//
// IMPORTANT: avoid a semicolon character in comments -- Quake's
// Cbuf_Execute splits on \n OR that character (cmd.c:162), so a stray
// one mid-comment splits the line and what follows is parsed as a
// fresh command.
//
// This is the only slice that links SDL2 rather than SDL 1.2 (docs/adr/0003).
// It is also the only one with no machine in the fleet older than the
// engine, so nothing here is a compromise for weak hardware. Every visual
// feature the engine has is on.

// ---------------------------------------------------------------
// Display: fullscreen at the desktop's own resolution.
//
// NOT a literal 1920x1080 exclusive mode -- that was this file's setting
// through v1.15.10 and it silently failed to go fullscreen at all on real
// hardware (a MacBook Air, Apple M5): SDL2's VID_ValidMode asks macOS to
// enumerate an exact 1920x1080@60Hz display mode, and on a Retina/scaled
// panel that isn't a real enumerable mode, so validation fails, VID_Restart
// prints "1920x1080x32 60Hz fullscreen is not a valid mode" and ABORTS
// without changing anything -- the window silently stays at its small
// startup default. Confirmed reproducing 3 times same session, 2026-09-02.
//
// vid_desktopfullscreen 1 sidesteps the whole exact-mode-enumeration path
// (VID_ValidMode's very first check: "ignore width/height/bpp if
// vid_desktopfullscreen is enabled") and uses SDL_WINDOW_FULLSCREEN_DESKTOP
// instead -- a borderless window sized to the CURRENT desktop resolution,
// no mode switch involved, so there is nothing to fail to enumerate. Same
// mechanism the iMac G5 SDL 1.2 path already uses for its own reason (a
// mode SWITCH hard-hangs its Radeon 9600 driver -- see gl_vidsdl.c). Explicit
// vid_width/vid_height are dropped: SDL2 overrides them to the desktop's
// actual size once this flag is set, so they were dead cvars, not merely a
// preference -- confirmed live: requesting 1920x1080 with this flag on
// still measured "Video mode 1710x1073x32" (this laptop's real logical
// resolution), not 1920x1080.
//
// This does give up the old "cap the backbuffer at 1080p, not native
// Retina res" fill-rate saving the previous comment here described. Not a
// real cost on this hardware class: Apple Silicon GPUs already have
// 7-12x fps headroom over any plausible refresh rate at Quake's texture
// resolution with every visual feature on (see r_decal_max below) -- a
// bigger backbuffer on a GPU this fast is free, a launch that never
// reaches fullscreen is not. Measured working end-to-end on real hardware
// (Apple M5, MacBook Air): timedemo demo1, three runs, 82.6 / 104.9 / 118.5
// fps -- comfortably clear of any plausible display refresh. Not run
// through scripts/bench.sh: that script has no "workstation" (local
// Apple Silicon) target yet, a separate tooling gap.
vid_desktopfullscreen 1
vid_fullscreen 1
// vid_vsync on. Apple Silicon renders this engine far faster than any
// display refresh, so an uncapped loop is pure heat.
vid_vsync 1
// ---------------------------------------------------------------

// Every renderer feature on. The GPU is idle at this workload.
r_oldwater 0
r_lerplightstyles 1
gl_texture_anisotropy 16
r_shadows 1
gl_texturemode "GL_LINEAR_MIPMAP_LINEAR"
gl_texture_lodbias 0

// Decal cap raised from the shipped default of 32 -- issue #22. No bundle
// config touched this cvar on any machine before today, so every machine
// from a 1999 G3 to Apple Silicon took the same cap. #22's A/B on mini-g4
// and yosemite found decal cost unmeasurable even at 128 live decals
// (2.19x the default cap) on a Rage 128, the weakest GPU in the fleet.
// arm64 measured 7-12x headroom above any plausible refresh with the full
// shipped visual stack already on (#29), so 128 here is not a guess about
// this GPU, it is the same cap already shown free on a much weaker one.
// Not measured on THIS class specifically -- flip back to 32 if a real
// arm64 machine joins the fleet and a bench says otherwise.
r_decal_max 128

// ---------------------------------------------------------------
// Engine timing: keep the demo loop at the recorded speed.
host_maxfps 72
host_framerate 0
host_timescale 0
// ---------------------------------------------------------------

// Audio baselines, in case a stale config.cfg zeroed one.
volume 0.7
bgmvolume 1.0
// ---------------------------------------------------------------

// Apply the resolution change.
vid_restart

// ---------------------------------------------------------------
// Default controls, matching the rest of the fleet.
bind LEFTARROW +moveleft
bind RIGHTARROW +moveright
bind a +moveleft
bind d +moveright
bind F12 screenshot_desktop
+mlook

gl_aliasstate_cache 1
// ---------------------------------------------------------------

// --- Apple Watch tactical computer (watchlink) ----------------------
// See autoexec-x86_64.cfg for the rationale.
watch_host "auto"
watch_port "27999"

// Translucent liquid surfaces (water, lava, teleporters, slime).
// 0.6 = subtly see-through, showing the volume underneath. Added
// 2026-08-21: these arch baselines set no liquid alpha at all, so a
// machine with no per-machine config of its own got opaque liquids
// while every G4 did not. These GPUs are strictly faster than the
// Radeon 9000 this is measured cheap on.
r_wateralpha 0.6
r_lavaalpha 0.6
r_telealpha 0.6
r_slimealpha 0.6
