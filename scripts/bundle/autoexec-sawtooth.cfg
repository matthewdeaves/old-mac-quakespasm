// Sawtooth (PowerMac G4 AGP, 500 MHz 7400, NVIDIA GeForce2 MX 32 MB,
// 10.4.11 Tiger). Added 2026-05-09 round v5 wrap.
//
// Sawtooth is the SLOWEST CPU + WEAKEST + only-fixed-function GPU among
// the G4 trio. GeForce2 MX (1999 silicon, 32 MB VRAM, no fragment
// shaders, no GLSL) is closer in capability to yosemite's Rage 128
// than to Quicksilver's Radeon 9000. The 500 MHz 7400 is also the
// slowest AltiVec part we ship to. Tuning bias: lean conservative on
// visuals, lean toward GPU-work-reduction (B1 dlight-distance) instead
// of GPU-work-addition (anisotropic, shadows).
//
// Baseline (no autoexec, engine defaults) at b5982ea9:
//   demo1 1024 = 52.20 fps
//   demo1 640  = 87.60 fps
//   demo3      = (measured this round)

// r_oldwater 1 — GeForce2 MX is fixed-function (GL 1.2-class with NV
// extensions) -- no GLSL means r_oldwater 0 falls back to classic warp
// anyway. Pin to 1 so the choice is explicit and we avoid the cost of
// the engine probing for shader support every video reload.
r_oldwater 1

// gl_texturemode trilinear — GeForce2 MX supports
// GL_LINEAR_MIPMAP_LINEAR natively -- cost on a 1999 GPU is non-zero
// but smooths the mip seams that are visible at this fillrate.
gl_texturemode "GL_LINEAR_MIPMAP_LINEAR"

// gl_texture_anisotropy NOT bumped. GeForce2 MX has at best 2× via
// NV_texture_env_combine4 trickery, no ARB_texture_filter_anisotropic.
// Engine would clamp silently if we set 16, but explicit is better
// than implicit — leave at engine default 1.

// r_shadows — let the ppc7400 baseline's `r_shadows 1` apply. User
// directive 2026-05-09: the visual stack on the G4 trio should be at
// least as rich as the G3 (which ships shadows-on) -- previous override
// to 0 was made under the original 60-fps "comfortably playable" G4
// floor, but that floor was never load-bearing — round v7 yosemite
// holds 19.80 fps demo3 1024 and the project shipped at the 20-fps
// floor with full visual stack. Sawtooth's demo1 1024 is 42.65 fps
// (round v7 wrap) -- ~11% shadow cost = ~38 fps, still well above the
// 20-fps absolute playability floor. Visual parity with the G3 wins
// over an arbitrary ≥60-fps target on this specific machine.
//
// (No explicit `r_shadows` line here — ppc7400.cfg loads first with
// `r_shadows 1` and we keep it.)

// r_shadow_distance 512 — match the G4 trio's shadow distance gate
// now that shadows are on. Quicksilver + mini-g4 also use 512 --
// elides shadow draws past N units from viewer where the entity
// itself is < 20 px and the drop-shadow is visually negligible.
// Pairs naturally with r_shadows 1.
r_shadow_distance 512

// gl_texture_lodbias -1.5 — sharper distant-mip selection for
// textured walls. Set on quicksilver + mini-g4 as a Radeon 9000/9200
// fix. Inert on GPUs that don't expose GL_TEXTURE_LOD_BIAS_EXT
// (engine swallows the call silently). GeForce2 MX with NV's older
// driver is unlikely to support it, so this is a no-op insurance
// in case the driver does honor it on some Tiger build path.
gl_texture_lodbias -1.5

// r_dynamic_distance 768 — round v5 B1 lever. GeForce2 MX has the
// same fixed-function dlight cost profile as yosemite's Rage 128:
// each dlight = full extra blending pass per touched surface, no
// fragment-shader dlight path available. Skipping far-away dlights
// removes per-dlight GPU passes that are visually imperceptible.
// Quicksilver/mini-g4 stay at 0 (programmable Radeons). Yosemite
// uses 768 too.
r_dynamic_distance 768

// r_lavaalpha / r_telealpha / r_slimealpha 0.6 — translucent liquid
// surfaces. Visual upgrade with negligible cost: liquid surface area
// is small and GeForce2 MX does alpha-blend cheaply.
r_lavaalpha 0.6
r_telealpha 0.6
r_slimealpha 0.6

// r_wateralpha 0.6 — plain water translucency. Same path as the
// liquid alphas above -- on GeForce2 MX (no GLSL → classic warp),
// this is alpha-blended textured warp. Water surfaces are larger
// than lava/tele so cost is more visible. Smoke confirms no demo2
// regression.
r_wateralpha 0.6

// gl_zfix 1 — z-fighting fix for coincident surfaces. Free if no
// surfaces actually fight -- matches every other target's autoexec.
gl_zfix 1

// gl_clear 1 — explicit override. Round v5 wrap pass 3 probe
// (2026-05-09) tested gl_clear 0 on sawtooth and **regressed**
// (-2.1% on demo3 1024: 47.70 → 46.70 fps). All other 4 targets
// gained +3.5% to +9.3% from this lever -- only sawtooth's GeForce2 MX
// driver handles the no-clear path less efficiently than the
// explicit clear.
//
// IMPORTANT: explicit override required because autoexec-ppc7400.cfg
// loads first and sets the gl_clear-0 lever for quicksilver+mini-g4
// to inherit. Without this override, sawtooth would inherit the
// regression above.
gl_clear 1

// Round v5 wrap pass 4 (2026-05-09): default video + HUD settings
// for manual launches via the .app icon. Without these, the engine
// falls back to vid_width 800 / vid_height 600 default and any
// stale viewsize from a prior session sticks. Setting them in
// PPC port -- Round v7 phase 2 (Tier A) emissive-fullbright lights.
// Surfaces with emissive textures (light/button/comp/tech/panel/screen)
// inject coloured dlights into cl_dlights[]. Same blend-pass cost on
// fixed-function GPUs as muzzle/rocket dlights. Sawtooth is the weakest
// G4 GPU (GeForce2 MX 32 MB, no fragment shaders), so tight radius +
// low cap. Drop to `r_emissive_lights_max 4` or `r_emissive_lights 0`
// if demo3 1024 drops below 30 fps in actual play.
r_emissive_lights         1
r_emissive_lights_radius  0.5
r_emissive_lights_max     6

// autoexec ensures the bundle always presents the same way:
//   1024x768 fullscreen with the classic HUD strip.
// Note: vid_width/vid_height take effect on NEXT launch (autoexec
// runs after VID_Init, so config.cfg gets the new value at quit).
// The companion deploy step seeds id1/config.cfg directly so the
// change is visible from the very next launch.
viewsize 100
// Take the DESKTOP's own mode rather than switching the display to a fixed
// size. A hardcoded resolution cannot promise to be displayable: the Quake 3
// port shipped one a cheap 1024x768 monitor could not sync to, and that machine
// could not start the game at all until it was changed. The vid_width/vid_height
// below stay as the fallback if the desktop cannot be read.
vid_desktopfullscreen 1
vid_width 1024
vid_height 768
vid_fullscreen 1
