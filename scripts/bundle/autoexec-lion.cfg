// Lion (Intel Mac mini, Macmini2,1, GMA 950) visual + perf tuning —
// managed by scripts/deploy.sh.
//
// Lion's GPU is weak (GMA 950 has no hardware T&L, low fillrate, GL 1.4
// only — no GLSL) but the Core 2 Duo @ 2.33 GHz is strong on the CPU
// side. Net: at 1024×768 we're GPU-bound (96 fps), at 640×480 we're
// CPU-bound (226 fps). Either way, well above the 60 fps playability
// floor with room for visual upgrades.

// r_oldwater 1 — GMA 950 reports GL 1.4, no GLSL. The new-water shader
// requires GLSL so r_oldwater 0 falls back to classic warp anyway;
// pinning to 1 makes the choice explicit.
r_oldwater 1

// gl_texture_anisotropy 16 — GMA 950 reports
// EXT_texture_filter_anisotropic; engine clamps silently to the GPU's
// `GL_MAX_TEXTURE_MAX_ANISOTROPY_EXT` if 16 isn't supported.
// §14.3 item 2 (Pass A §3a) — bumped 8 → 16 alongside G4 for parity.
gl_texture_anisotropy 16

// r_shadows 1 — alias drop-shadow. Core 2 Duo handles the extra alias
// pass cheaply; expected cost ≤ 10%, leaves us ≥ 85 fps at 1024×768
// (above the 60 fps floor).
r_shadows 1

// gl_texturemode "GL_LINEAR_MIPMAP_LINEAR" — trilinear filtering.
// Pairs with anisotropy; smooths the seam where mip levels change.
gl_texturemode "GL_LINEAR_MIPMAP_LINEAR"
