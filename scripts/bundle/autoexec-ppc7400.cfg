// PPC 7400 (G4 AltiVec) -- Quicksilver + Mac mini G4 + any 7447/7450
// running this fat-binary slice. Loaded automatically by host.c's per-arch
// engine hook AFTER quake.rc finishes (so these cvars win over default.cfg
// / config.cfg / autoexec.cfg).
//
// IMPORTANT: avoid `;` in comments -- Quake's Cbuf_Execute splits on \n
// OR `;` (cmd.c:162), so a stray semicolon mid-comment splits the line
// and what follows is parsed as a fresh command.
//
// Targets share the AltiVec slice (ppc7400 CPU subtype) but ship different
// GPUs: Quicksilver = Radeon 9000 64MB, Mac mini G4 = Radeon 9200 32MB.
// Both run Tiger 10.4. Tunings below tested on Quicksilver as primary,
// validated on Mac mini G4 as second AltiVec data point.

// ---------------------------------------------------------------
// Display: 1024x768 fullscreen
//
// Engine defaults are 800x600 windowed (gl_vidsdl.c:165-167). VID_Init
// runs CFG_ReadCvars before opening the GL window, so on the SECOND and
// later launches the engine boots directly at the values config.cfg has
// archived (CVAR_ARCHIVE writes them on quit). On the FIRST launch after
// deploy the engine briefly opens at 800x600 then vid_restart below
// flips us to 1024x768 -- one-time flicker.
vid_width 1024
vid_height 768
vid_fullscreen 1
// vid_vsync left at engine default 0. Setting it 1 here triggered a
// boot-time vid_restart that capped bench fps at the display refresh
// (60 Hz, ~46% G4 fps drop). Tearing on the title-screen demo loop
// hasn't been an issue interactively. User can `vid_vsync 1` in
// console if they want it.
// ---------------------------------------------------------------

// Visual upgrades. Radeon 9000/9200 + Tiger has the headroom for these
// at 1024x768 while staying above the 60 fps playability floor on demo1.
gl_texture_anisotropy 16
r_oldwater 0

r_shadows 1                                  // alias drop-shadow on the floor
gl_texturemode "GL_LINEAR_MIPMAP_LINEAR"     // trilinear filtering

// Round v4 -- gl_texture_lodbias. User reported soft mipmap LODs on
// Radeon 9000 distant brick walls and slipgate signs. Lion / GMA 950
// does not exhibit it on the same engine, so the Radeon driver picks a
// coarser mip than ATI/Apple should. Negative bias pulls the sampler
// toward sharper mips. -1.5 is the sweet spot in initial testing --
// noticeably sharper than 0, no aliasing crawl.
gl_texture_lodbias -1.5

// Pass C HIGH leverage (Round v3 Task #10) -- distance-gate the shadow
// pass. Each shadow draw costs an R_LightPoint BSP trace plus matrix
// setup plus alias frame draw, and far-away entities cast shadows that
// are visually negligible (the entity itself is a few pixels). 512 units
// is roughly the distance at which a typical alias model occupies fewer
// than 20 pixels at 1024x768. Engine default 0 means unlimited.
r_shadow_distance 512

// Translucent liquid surfaces (lava, teleporters, slime). 0.6 = subtly
// see-through, showing the volume underneath. Negligible fps cost on
// Radeon 9000/9200 because liquid surface area is small.
r_lavaalpha 0.6
r_telealpha 0.6
r_slimealpha 0.6

// gl_zfix 1 -- z-fighting fix for coincident surfaces. Cost is near zero
// when no surfaces actually fight, so revive default-on and any custom
// map that needs it gets the fix without per-map config.
gl_zfix 1

// ---------------------------------------------------------------
// Engine timing: keep demo loop at the recorded speed.
//
// host_maxfps caps render-frame ticking. host.c:62 default is 72.
// host_framerate / host_timescale are debug knobs that override the
// per-tick frametime -- if a stale config.cfg from a prior session has
// either set, the in-game demo loop runs sped up. Force them back to
// safe defaults here.
host_maxfps 72
host_framerate 0
host_timescale 0
// ---------------------------------------------------------------

// ---------------------------------------------------------------
// Audio. Engine defaults are sane (volume 0.7, bgmvolume 1.0) but a
// stale config.cfg may have one of these zeroed. Set explicit baselines.
volume 0.7
bgmvolume 1.0
// ---------------------------------------------------------------

// Apply the resolution change. No-op on launches where the engine
// already booted at 1024x768 from config.cfg (vid_changed flag stays
// false because the cvars were already at these values pre-autoexec).
vid_restart

// ---------------------------------------------------------------
// Default controls. default_cfg.h ships these as engine defaults
// but a stale config.cfg from a prior session will have its own
// `bind LEFTARROW +left` etc lingering, overriding default.cfg via
// quake.rc's exec ordering. Re-bind them here so the user's manual
// launches always boot with the project-preferred control scheme.
// User can change these in the Options menu and the new binds will
// stick in config.cfg until the next deploy of an updated autoexec.
//
// Strafe-on-arrows (matches modern FPS muscle memory). Hold ALT to
// turn instead (default ALT bind is `+strafe`). a/d also strafe.
bind LEFTARROW +moveleft
bind RIGHTARROW +moveright
bind a +moveleft
bind d +moveright

// F12 -> screenshot saved to ~/Desktop/quakespasm-screenshots/
// (custom command added in round v4, keeps the plain `screenshot`
// command intact for the headless bench/screenshot scripts).
bind F12 screenshot_desktop

// Mouse look on at boot. default_cfg.h does `+mlook` for fresh
// installs; this re-enables it explicitly in case a stale config.cfg
// recorded the toggle in its off state.
+mlook
// ---------------------------------------------------------------
