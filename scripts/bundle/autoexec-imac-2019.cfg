// iMac 2019 27" (iMac19,1) — by far the most capable target in the
// bench matrix. Intel i5-9600K @ 3.70 GHz (6-core Coffee Lake Refresh),
// AMD Radeon Pro 580X 8 GB VRAM, macOS 15.7.5 Sequoia.
//
// Hits ~2000 fps at 1024×768 with full visual stack — orders of
// magnitude faster than mini-intel (96 fps at the same cell). The
// limiting factor is CPU-side per-frame work, not GPU.
//
// We ship the Lion-SDK 10.7-target x86_64 binary here (same as
// mini-intel), so the engine still uses the GL 1.x fixed-function
// path even though the GPU is fully programmable. That's fine — the
// Radeon Pro 580X handles fixed-function fillrate trivially. There's
// no point trying to opt into shader paths on a binary that wasn't
// built for them.

// === Visual stack — pushed to maximum ===

// Anisotropic filtering. Radeon Pro 580X clamps internally if 16 isn't
// supported (it is — modern AMD parts go to 16). Sharper textures at
// oblique angles.
gl_texture_anisotropy 16

// Trilinear filtering. Smooths the seam where mip levels change.
gl_texturemode "GL_LINEAR_MIPMAP_LINEAR"

// New-water shader path. Lion-SDK build uses GL 1.x but the engine
// will fall back to classic warp if shaders unavailable; explicit
// 0 makes the choice clear and lets the shader path activate if
// the GL context exposes it.
r_oldwater 0

// PPC port -- finding #5: r_lerplightstyles interpolates the 10Hz
// lightstyle step so torches/pulsing lights ramp smoothly (hard
// flicker stays sharp via the engine MAXDELTA guard). Radeon Pro 580X — trivial cost; smooth torch/pulse ramps.
r_lerplightstyles 1

// Alias drop-shadow on the floor. Cost is trivial on this GPU.
r_shadows 1

// r_shadow_distance left at engine default 0 (= unlimited): iMac has
// no fillrate constraints. Gating would be saving negligible GPU work
// at the cost of visible drop-shadows on distant entities.

// r_dynamic_distance left at engine default 0: same reasoning.
// Modern AMD GPU has headroom for any number of dlights at this
// fillrate.

// === Liquid translucency (round v5 wrap pass 2 family) ===

// All four liquid alphas at 0.6 — see-through water/lava/teleporters/
// slime showing the volume underneath. Cheap visible win.
r_lavaalpha 0.6
r_telealpha 0.6
r_slimealpha 0.6
r_wateralpha 0.6

// === Round v5 wrap pass 3 ===

// Skip per-frame backbuffer color clear. Quake fills 100% of the
// screen with world+sky so the clear is a redundant fillrate-bound
// write. Verified safe across the matrix (yosemite + quicksilver
// visual A/B in pass 3); negligible per-frame artefact only on the
// rare death-cam-out-of-bounds case. Win at this scale: maybe
// imperceptible (we're CPU-bound) but harmless.
gl_clear 0

// === Hygiene ===

gl_zfix 1                                    // z-fighting fix for coincident surfaces

// === Round v6 (launch defaults) ===

// 2560×1440 fullscreen with HUD strip. The native panel is 5120×2880;
// 1440p is the 1:4 pixel ratio mode the OS already advertises and the
// display upscales it cleanly. Picked over native 5K because per-pixel
// alpha-blend cost (water + lava + tele + slime translucency) at full
// 5120×2880 = 14.7 Mpix/frame is heavy enough to worry the 60-fps
// floor on demo3, and 1440p is visibly sharp on a Retina panel anyway.
// User can `vid_width 5120 vid_height 2880 ; vid_restart` in console
// for native, or 3840×2160 / 1920×1080 for other points.
// PPC port -- Round v7 phase 2 (Tier A) emissive-fullbright lights.
// Radeon Pro 580X 8GB has acres of fillrate; let it rip with a wide
// radius (1.5) and a high simultaneous-light cap (32 — emissive seeds
// can compete with muzzle/rocket dlights without ever saturating the
// 64-slot cl_dlights[] pool now that B1 fixed the die-window bug).
r_emissive_lights         1
r_emissive_lights_radius  1.5
r_emissive_lights_max     32

viewsize 100
// Take the DESKTOP's own mode rather than switching the display to a fixed
// size. A hardcoded resolution cannot promise to be displayable: the Quake 3
// port shipped one a cheap 1024x768 monitor could not sync to, and that machine
// could not start the game at all until it was changed. The vid_width/vid_height
// below stay as the fallback if the desktop cannot be read.
vid_desktopfullscreen 1
vid_width 2560
vid_height 1440

// === Code-review cheap wins (2026-05-29) — UNVERIFIED (machine was
// offline when shipped; confirm next time iMac is up) ===
// vid_bpp 32 -> request 24-bit depth + 8-bit stencil so r_shadows
// (above) gets its stencil self-intersection mask (at vid_bpp 16 the
// engine forces stencilbits=0 and R_DrawShadows' `if (gl_stencilbits)`
// guard in gl_rmain.c never runs). NOTE: on this 5K Retina panel the
// display almost certainly only offers 32-bit colour, so VID_ValidMode
// would already fall back to 24-bit depth + stencil even without this
// line (verified on the LCD G4s: quicksilver honours vid_bpp 16 as a
// genuine 16-bit/no-stencil mode, but its display can do 16-bit colour;
// modern panels can't). So this line is mostly belt-and-suspenders here.
vid_bpp 32
// vid_fsaa 8 -> 8x MSAA. THIS is the real iMac win: the 580X sits at
// ~1600 fps with acres of headroom and otherwise shows nothing the
// weaker targets don't, so 8x MSAA on edges + alpha-tested fences is the
// "spend the headroom" upgrade. Needs the VID_Restart fsaa-refresh fix in
// gl_vidsdl.c (upstream VID_Restart never re-reads the fsaa global, so a
// vid_fsaa set in autoexec was silently ignored). Engine gracefully
// scales MSAA/depth/stencil back if the mode can't be created.
vid_fsaa 8
vid_fullscreen 1
// Apply vid_bpp/vid_fsaa now: VID_Init already created the context at
// the 16bpp/0-fsaa default before this autoexec ran, so force the
// context rebuild at boot (same pattern the per-arch cfgs use).
vid_restart
