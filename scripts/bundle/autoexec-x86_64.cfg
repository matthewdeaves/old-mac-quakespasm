// x86_64 (Intel) -- 10.7 Lion and later. Loaded automatically by host.c's
// per-arch engine hook AFTER quake.rc.
//
// IMPORTANT: avoid `;` in comments -- Quake's Cbuf_Execute splits on \n
// OR `;` (cmd.c:162), so a stray semicolon mid-comment splits the line
// and what follows is parsed as a fresh command.
//
// Primary bench target: Macmini2,1 / Core 2 Duo 2.33 GHz / GMA 950 / Lion.
// Lion's GPU stack is weak (GMA 950 has no hardware T&L, low fillrate,
// GL 1.4 -- no GLSL) but the CPU is strong. At 1024x768 we're GPU-bound
// (~96 fps), at 640x480 CPU-bound (~226 fps). Both well above the 60 fps
// playability floor.

// r_oldwater 1 -- GMA 950 reports GL 1.4, no GLSL. The new-water shader
// requires GLSL so r_oldwater 0 falls back to classic warp anyway.
// Pinning to 1 makes the choice explicit.
r_oldwater 1

// gl_texture_anisotropy 16 -- engine clamps silently to the GPU's
// GL_MAX_TEXTURE_MAX_ANISOTROPY_EXT if 16 isn't supported.
gl_texture_anisotropy 16

// r_shadows 1 -- alias drop-shadow. Core 2 Duo handles the extra alias
// pass cheaply with cost under 10%, leaves us above 85 fps at 1024x768.
r_shadows 1

// Trilinear filtering. Pairs with anisotropy and smooths the seam where
// mip levels change.
gl_texturemode "GL_LINEAR_MIPMAP_LINEAR"

// Round v4 -- gl_texture_lodbias defaults to 0 on Lion. User confirms
// distant brick walls already render sharply on GMA 950, unlike the
// Radeon 9000 which needs negative bias. Cvar still exists as a runtime
// knob in case a future Intel GPU shows the same blur.
gl_texture_lodbias 0

// Pass B B4 verified 2026-05-08: -noglslalias is a no-op on this target.
// GMA 950 reports GL 1.4 only so gl_glsl_alias_able never becomes true.
// Flag only useful on a future Intel target with a GLSL-capable GPU.
