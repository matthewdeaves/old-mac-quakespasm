// x86_64 (Intel) -- 10.7 Lion and later. Loaded automatically by host.c's
// per-arch engine hook AFTER quake.rc.
//
// IMPORTANT: avoid `;` in comments -- Quake's Cbuf_Execute splits on \n
// OR `;` (cmd.c:162), so a stray semicolon mid-comment splits the line
// and what follows is parsed as a fresh command.
//
// Primary bench target: Macmini2,1 / Core 2 Duo 2.33 GHz / GMA 950 / Lion.
// Lion's GPU stack is weak (GMA 950 has no hardware T&L, low fillrate,
// GL 1.4 -- no GLSL) but the CPU is strong. At 1024x768 we're GPU-bound
// (~96 fps), at 640x480 CPU-bound (~226 fps). Both well above the 60 fps
// playability floor.

// ---------------------------------------------------------------
// Display: 1024x768 fullscreen
//
// Engine defaults are 800x600 windowed (gl_vidsdl.c:165-167). VID_Init
// runs CFG_ReadCvars before opening the GL window, so on the SECOND
// and later launches the engine boots directly at the values
// config.cfg archived. On the FIRST launch after deploy the engine
// briefly opens at 800x600 then vid_restart below flips us to 1024x768.
vid_width 1024
vid_height 768
vid_fullscreen 1
// vid_vsync left at engine default 0. GMA 950 doesn't reliably honor
// swap interval anyway, so this is mostly for consistency with the
// PPC autoexecs.
// ---------------------------------------------------------------

// r_oldwater 1 -- GMA 950 reports GL 1.4, no GLSL. The new-water shader
// requires GLSL so r_oldwater 0 falls back to classic warp anyway.
// Pinning to 1 makes the choice explicit.
r_oldwater 1

// PPC port -- finding #5: r_lerplightstyles interpolates the 10Hz
// lightstyle step so torches/pulsing lights ramp smoothly (hard
// flicker stays sharp via the engine MAXDELTA guard). Intel baseline default OFF; imac-2019 overlay flips it on. mini-intel (GMA 950, fillrate-bound) stays off.
r_lerplightstyles 0

// gl_texture_anisotropy 16 -- engine clamps silently to the GPU's
// GL_MAX_TEXTURE_MAX_ANISOTROPY_EXT if 16 isn't supported.
gl_texture_anisotropy 16

// r_shadows 1 -- alias drop-shadow. Core 2 Duo handles the extra alias
// pass cheaply with cost under 10%, leaves us above 85 fps at 1024x768.
r_shadows 1

// Trilinear filtering. Pairs with anisotropy and smooths the seam where
// mip levels change.
gl_texturemode "GL_LINEAR_MIPMAP_LINEAR"

// Round v4 -- gl_texture_lodbias defaults to 0 on Lion. User confirms
// distant brick walls already render sharply on GMA 950, unlike the
// Radeon 9000 which needs negative bias. Cvar still exists as a runtime
// knob in case a future Intel GPU shows the same blur.
gl_texture_lodbias 0

// Pass B B4 verified 2026-05-08: -noglslalias is a no-op on this target.
// GMA 950 reports GL 1.4 only so gl_glsl_alias_able never becomes true.
// Flag only useful on a future Intel target with a GLSL-capable GPU.

// ---------------------------------------------------------------
// Engine timing: keep demo loop at the recorded speed.
//
// host_maxfps caps render-frame ticking. host.c:62 default is 72.
// host_framerate / host_timescale are debug knobs that override the
// per-tick frametime -- if a stale config.cfg from a prior session has
// either set, the in-game demo loop runs sped up. Force them back to
// safe defaults here.
host_maxfps 72
host_framerate 0
host_timescale 0
// ---------------------------------------------------------------

// ---------------------------------------------------------------
// Audio. Engine defaults are sane (volume 0.7, bgmvolume 1.0) but a
// stale config.cfg may have one of these zeroed. Set explicit baselines.
volume 0.7
bgmvolume 1.0
// ---------------------------------------------------------------

// Apply the resolution change. No-op on launches where the engine
// already booted at 1024x768 from config.cfg.
vid_restart

// ---------------------------------------------------------------
// Default controls (round v4). Strafe-on-arrows + a/d, F12 saves
// screenshot to ~/Desktop/quakespasm-screenshots/, mouse look on.
// See autoexec-ppc7400.cfg for the full rationale comment block.
bind LEFTARROW +moveleft
bind RIGHTARROW +moveright
bind a +moveleft
bind d +moveright
bind F12 screenshot_desktop
+mlook

// Round v11.1 — defensively re-assert alias state-cache to engine
// default (1 = enabled). See autoexec-ppc7400.cfg for the full
// drift-protection rationale. Applies to mini-intel + imac-2019;
// both run the x86_64 slice with the cache compiled in.
gl_aliasstate_cache 1
// ---------------------------------------------------------------
