// iMac G4 "sunflower / lamp" (PowerMac4,2 / 6,1 / 6,3 -- 700 MHz-1.25 GHz
// PPC 7445/7455, GeForce2 MX / GeForce4 MX / Radeon 9000/9200, Mac OS X
// 10.3-10.4) -- per-MACHINE overlay, picked by host.c via sysctl hw.model.
//
// *** UNTESTED ON HARDWARE *** -- there is no iMac G4 in the bench fleet.
// This is a best-effort default built on the validated generic
// vid_desktopfullscreen feature + the proven GL 1.x G4 visual stack
// (mini-g4 / Radeon 9200). It runs the ppc7400 slice, and every iMac G4
// GPU is GL 1.x fixed-function and NON-R300, so there is no GLSL-hang
// risk (that gate is specific to the Radeon 9500-9800). Worst case of a
// wrong hw.model id: this overlay simply doesn't load and the machine
// falls back to the safe ppc7400 1024x768 baseline. If you have an iMac
// G4 and the framerate is low (700 MHz + GeForce2 MX is the weak end),
// dial settings back via the console -- everything here is a cvar.
//
// IMPORTANT: avoid a semicolon character in comments -- Cbuf_Execute
// splits on \n OR that character.

// --- Display: native-panel-resolution fullscreen via same-mode CAPTURE
// (no mode switch). Auto-picks the panel's native max: 15" iMac G4
// 1024x768, 17" 1440x900, 20" 1680x1050. Gentlest fullscreen path on any
// old driver. (For the 15" panel this equals the 1024x768 baseline.) ---
vid_desktopfullscreen 1
vid_fullscreen 1
vid_restart

// --- Visual stack (GL 1.x fixed-function, proven on the Radeon 9200
// mini-g4). 16bpp -- NOT vid_bpp 32 (the Radeon 9200 hard-wedges the
// 32bpp context, see MISTAKES.md 2026-05-29 -- play safe on unknown iMac
// G4 GPUs). ----------------------------------------------------------
gl_texture_anisotropy 16
r_oldwater 0
r_lerplightstyles 1
r_shadows 1
gl_texturemode "GL_LINEAR_MIPMAP_LINEAR"
gl_texture_lodbias -1.5
r_shadow_distance 512
r_lavaalpha 0.6
r_telealpha 0.6
r_slimealpha 0.6
r_wateralpha 0.6
gl_clear 0
gl_zfix 1
r_emissive_lights        1
r_emissive_lights_radius 1.0
r_emissive_lights_max    12

viewsize 100
