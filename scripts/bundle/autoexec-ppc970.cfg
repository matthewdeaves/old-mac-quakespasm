// PPC 970 (G5) -- generic baseline for ANY PowerPC G5 running this
// fat-binary slice (iMac G5, Power Mac G5, Xserve G5) on Leopard 10.5.
// Loaded automatically by host.c's per-arch engine hook (gated on the
// QS_ARCH_PPC970 build macro) AFTER quake.rc finishes, so these cvars
// win over default.cfg / config.cfg / autoexec.cfg. A per-machine
// overlay (sysctl hw.model, e.g. autoexec-imac-g5) layers on top for
// the specific bench G5 -- this file is the floor every other G5 gets.
//
// IMPORTANT: avoid `;` in comments -- Quake's Cbuf_Execute splits on \n
// OR `;` (cmd.c:162), so a stray semicolon mid-comment splits the line
// and what follows is parsed as a fresh command.
//
// Seeded from the ppc7400 (G4 AltiVec) baseline: known-good on every
// AltiVec PPC, and the 970 is strictly faster, so this is a safe floor.
// The G5 has real headroom over a 7450 (faster core, Radeon 9600 on the
// 17"/2.0 ALS vs Radeon 9000/9200 on the G4s) -- richer settings get
// dialed in via bench data in an optimization round, landing in the
// per-machine overlay first, then promoted here once validated on a
// second G5 data point. Until then: match the proven AltiVec config.

// ---------------------------------------------------------------
// Display: native-resolution desktop-fullscreen for EVERY G5.
// vid_desktopfullscreen makes the SDL 1.2 path request the EXACT current
// desktop mode (substitution in gl_vidsdl.c VID_SetMode), so SDL does a
// same-mode display CAPTURE instead of a resolution SWITCH. This is the
// ONLY safe fullscreen path on the iMac G5's ATI Radeon 9600 (R300) --
// a mode SWITCH hard-hangs that driver on Leopard. It's also the right
// default for ANY G5 we can't test: a Power Mac G5 tower might have an
// R300 too (Radeon 9600/9800), so a fixed 1024x768 would be a mode
// SWITCH = the same hazard. Native is always >= 1024x768 on a real Mac
// display, so the "at least 1024x768" floor still holds, and the panel's
// native max comes for free (17" iMac G5 1440x900, 20" 1680x1050).
// Empirically (Finder-launch test 2026-05-31) this gives a clean single
// 800x600 -> native transition with NO intermediate 1024x768 mode-switch
// flicker, and native depth (32bpp -> 24-bit z + stencil) via display_bpp.
// Toggle off (back to a fixed mode) with vid_desktopfullscreen 0 +
// vid_width/height. Pairs with the engine ATI R300 GL 1.x gate.
vid_desktopfullscreen 1
vid_fullscreen 1
// ---------------------------------------------------------------

// Visual upgrades. AltiVec PPC + Radeon has the headroom for these at
// 1024x768. The 970 + Radeon 9600 has more -- candidate to push harder
// once benched.
gl_texture_anisotropy 16
r_oldwater 0

// r_lerplightstyles: smooth 10Hz lightstyle interpolation. Left OFF in
// the generic floor (matches the G4 baseline). The G5 very likely has
// headroom to flip this on -- a per-machine-overlay / bench-pass call.
r_lerplightstyles 0

r_shadows 1                                  // alias drop-shadow on the floor
gl_texturemode "GL_LINEAR_MIPMAP_LINEAR"     // trilinear filtering
gl_texture_lodbias -1.5                      // sharper distant mips (see ppc7400 cfg)
r_shadow_distance 512                        // distance-gate shadow draws

// Translucent liquid surfaces (lava, teleporters, slime).
r_lavaalpha 0.6
r_telealpha 0.6
r_slimealpha 0.6

gl_zfix 1                                    // z-fight fix, ~zero cost when idle

// ---------------------------------------------------------------
// Engine timing: keep demo loop at recorded speed (see ppc7400 cfg).
host_maxfps 72
host_framerate 0
host_timescale 0
// ---------------------------------------------------------------

// Audio baselines (guard against a stale config.cfg zeroing them).
volume 0.7
bgmvolume 1.0

// Apply the resolution change.
vid_restart

// ---------------------------------------------------------------
// Default controls: strafe-on-arrows + a/d strafe, F12 screenshot,
// mouselook on (see ppc7400 cfg for the full rationale).
bind LEFTARROW +moveleft
bind RIGHTARROW +moveright
bind a +moveleft
bind d +moveright
bind F12 screenshot_desktop
+mlook

// Alias state-cache on by default (defensive re-assert -- the 970 runs
// the same AltiVec-slice code path as the G4 trio, so the cache applies).
gl_aliasstate_cache 1
// ---------------------------------------------------------------

// ---------------------------------------------------------------
// Lock the video mode -- MUST be the last line (after the boot
// vid_restart above). On the iMac G5's R300 a live fullscreen mode SWITCH
// hard-hangs the whole OS (fans to max, power-cycle only). The baseline
// already forces vid_desktopfullscreen so the boot is a safe same-mode
// capture, but vid_lock is the belt-and-suspenders guard: it makes the
// video menu / alt-enter / console `vid_restart` inert so nothing can
// trigger a mode SWITCH at runtime (e.g. after someone sets
// vid_desktopfullscreen 0). `vid_unlock` at the console re-enables it for
// a known-safe GPU (e.g. a GeForce-equipped Power Mac G5 tower). Only the
// CFBundle .app autoexec makes this stick (bench's staged cfg is cleared
// by host.c's post-quake.rc vid_unlock). See docs/KNOBS.md.
// --- Apple Watch tactical computer (watchlink) ----------------------
// Auto-discover the iPhone companion over Bonjour (_q2watch._udp) and
// stream live player state to the wrist. Off-fleet default is "" (inert);
// armed here in the per-arch baseline so EVERY G5 gets it (the per-machine
// overlay runs after this and leaves it untouched). QuakeSpasm has no
// "set" command — assign the cvar bare. Discovery is time-bounded (~30 s)
// and inert during demos, so a phoneless game costs nothing.
watch_host "auto"
watch_port "27999"

vid_lock
// ---------------------------------------------------------------
