// G4 visual + perf tuning — managed by scripts/deploy.sh.
// This is the SHIPPING config: best visuals while staying comfortably
// above 60 fps. Flipped per the project goal pivot 2026-05-08:
// 60+ fps on G4 is "perfectly playable" so a 10-15% headline-fps cost
// for noticeable visual upgrades is in scope.

// Phase 0 — anisotropic filtering and new-water shader. Radeon 9000
// has the headroom on Tiger to spend a few percent fillrate on these.
//
// §14.3 item 2 (Pass A §3a): bumped 8 → 16. Engine clamps silently to
// `GL_MAX_TEXTURE_MAX_ANISOTROPY_EXT` if the GPU caps lower, so
// setting 16 on a hardware-8x-max GPU is a no-op. Smoke verifies whether
// the bump moves fps (it shouldn't if hardware caps at 8) and visual
// quality (sharper textures at oblique angles when looking along walls).
gl_texture_anisotropy 16
r_oldwater 0

// §13.6 visual upgrades (Round v3, 2026-05-08).
//
// First pass tried r_shadows 1 + GL_LINEAR_MIPMAP_LINEAR together
// and reverted at -11..-12% across all G4 cells (well over the
// plan's predicted -1..-3%). The user's reframe of the project goal
// is that anything ≥60 fps on G4 is perfectly playable, so this
// drop is *acceptable* in exchange for the visual upgrade. Final
// G4 numbers with both ON: demo1 1024≈106 fps, demo3 1024≈81 fps,
// demo3 640≈94 fps — all above 60. RE-ENABLED.
//
// Each cvar can be flipped at runtime in console (`r_shadows 0`,
// `gl_texturemode "GL_LINEAR_MIPMAP_NEAREST"`) for end-of-round
// tuning experiments without a redeploy.

r_shadows 1                                  // alias drop-shadow on the floor
gl_texturemode "GL_LINEAR_MIPMAP_LINEAR"     // trilinear filtering

// Pass C HIGH leverage (Round v3 Task #10): distance-gate the shadow
// pass. Each shadow draw costs an R_LightPoint BSP trace + matrix
// setup + alias frame draw; distant entities cast shadows that are
// visually negligible (the entity itself is a few pixels). 512 units
// is roughly the distance at which a typical alias model occupies
// fewer than ~20 pixels at 1024×768 — past that, you cannot tell
// whether the shadow is there. Engine default is 0 (unlimited).
r_shadow_distance 512

// Pass B revive B3 (§14.3 follow-up).
//
// Translucent liquid surfaces (lava, teleporters, slime). Engine
// default 0 = opaque; 0.6 = subtly see-through, showing the volume
// underneath. Visual upgrade with negligible fps cost on Radeon 9000
// because liquid surface area is small.
r_lavaalpha 0.6
r_telealpha 0.6
r_slimealpha 0.6

// Round v5 wrap pass 2 (2026-05-09): plain water translucency. With
// r_oldwater 0 (shader water on Radeon 9000), the alpha is a single
// fragment-shader uniform — per-fragment uniform read for water
// surfaces, no extra pipeline state. Negligible cost; visual win.
r_wateralpha 0.6

// Round v5 wrap pass 3 (2026-05-09): skip backbuffer clear. Quake's
// world+sky covers the full screen so the per-frame clear is a
// redundant fillrate-bound write. **Biggest win on the matrix:**
// +7.1% on demo3 1024 (85.60 → 91.70).
//
// Round v6 (2026-05-09) — water-rendering fix landed engine-side
// (R_DrawTextureChains_Water two-pass split — container surfaces
// opaque, upward-facing tops translucent), so r_wateralpha 0.6 no
// longer reveals lower-room geometry through pool floors / SURF_-
// DRAWTURB stairs. gl_clear stays at 0; r_litwater stays at engine
// default 1.
gl_clear 0

// gl_zfix 1 — z-fighting fix for coincident surfaces. Engine-wide
// cost is zero if no surfaces actually fight; revive default-on so
// any custom map that needs it gets the fix without per-map config.
gl_zfix 1

// Round v5 wrap pass 4 (2026-05-09): default video + HUD settings
// for manual launches via the .app icon. Without these, the engine
// falls back to vid_width 800 / vid_height 600 default and any
// stale viewsize from a prior session sticks. Setting them in
// PPC port -- Round v7 phase 2 (Tier A) emissive-fullbright lights.
// Surfaces with emissive textures (light/button/comp/tech/panel/screen)
// cast coloured light onto surrounding geometry. Radeon 9000 has the
// fillrate headroom on Tiger to absorb the extra blend passes (engine
// uses no fragment-shader dlight path on this GPU; each light = full
// extra blend pass over touched surfaces). Radius 1.0 + cap 12 picks
// up the visible buttons/lights/screens without over-lighting rooms.
r_emissive_lights         1
r_emissive_lights_radius  1.0
r_emissive_lights_max     12

// autoexec ensures the bundle always presents the same way:
//   1024x768 fullscreen with the classic HUD strip.
// Note: vid_width/vid_height take effect on NEXT launch (autoexec
// runs after VID_Init, so config.cfg gets the new value at quit).
// The companion deploy step seeds id1/config.cfg directly so the
// change is visible from the very next launch.
viewsize 100
vid_width 1024
vid_height 768
vid_fullscreen 1
