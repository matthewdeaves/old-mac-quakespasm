// mini-sl (Macmini3,1, GeForce 9400M, Snow Leopard 10.6.8) -- overlay
// layered on top of autoexec-x86_64.cfg (host.c execs the arch baseline
// first, then this, via a runtime GL_RENDERER match -- see host.c's
// qs_machine_map comment; hw.model alone can't tell the single-9400M and
// switchable 9400M+320M Early-2009 mini configs apart).
//
// No per-class bench data exists yet for this GPU/driver combination
// (#77): the one prior attempt (issue #30, 2026-08-23) crashed before
// producing a number, and three separate crash-inducing bugs specific to
// this exact GPU have been fixed since (gl_vidsdl.c's multithreaded-GL
// gate and GLSL-alias gate, both keyed off this same "GeForce 9400"
// string match; APPLE_client_storage default-off on non-PowerPC).
//
// Deliberately a near-identical mirror of autoexec-x86_64.cfg for now,
// not a blind feature bump: this class needs its own VALID
// bench-evidence baseline first, then per-#69's methodology, any
// additional feature (vid_fsaa -- this GPU is ARB_multisample capable
// unlike GMA 950 --, r_lerplightstyles, r_shadow_distance tuning,
// emissive lights, gl_clear 0, decal cap) gets a same-session A/B before
// it ships here. This file exists so that future tuning has a per-class
// home instead of silently sharing the generic x86_64 baseline.

r_oldwater 1
r_lerplightstyles 0
gl_texture_anisotropy 16
r_shadows 1
gl_texturemode "GL_LINEAR_MIPMAP_LINEAR"
gl_texture_lodbias 0

host_maxfps 72
host_framerate 0
host_timescale 0

volume 0.7
bgmvolume 1.0

viewsize 100
vid_desktopfullscreen 1
vid_width 1024
vid_height 768
vid_fullscreen 1
vid_restart

bind LEFTARROW +moveleft
bind RIGHTARROW +moveright
bind a +moveleft
bind d +moveright
bind F12 screenshot_desktop
+mlook

gl_aliasstate_cache 1

r_wateralpha 0.6
r_lavaalpha 0.6
r_telealpha 0.6
r_slimealpha 0.6
