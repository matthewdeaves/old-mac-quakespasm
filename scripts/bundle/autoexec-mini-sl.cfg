// mini-sl (Macmini3,1, GeForce 9400M, Snow Leopard 10.6.8) -- overlay
// layered on top of autoexec-x86_64.cfg (host.c execs the arch baseline
// first, then this, via a runtime GL_RENDERER match -- see host.c's
// qs_machine_map comment -- hw.model alone can't tell the single-9400M and
// switchable 9400M+320M Early-2009 mini configs apart).
//
// No per-class bench data exists yet for this GPU/driver combination
// (#77): the one prior attempt (issue #30, 2026-08-23) crashed before
// producing a number, and three separate crash-inducing bugs specific to
// this exact GPU have been fixed since (gl_vidsdl.c's multithreaded-GL
// gate and GLSL-alias gate, both keyed off this same "GeForce 9400"
// string match, and APPLE_client_storage default-off on non-PowerPC).
//
// #77 baseline (2026-09-28): bench-evidence VALID, real GeForce 9400
// renderer (not the software fallback #30's crash left this class stuck
// on), 116.4 fps at 1024x768 production launch -- 4.6x the 25fps floor,
// most of it unspent. Same-session A/B, demo3 1024 (desktopfullscreen
// 1920x1080), 3 runs each side: r_lerplightstyles off 107.9/112.7/112.6
// (median 112.65) vs on 110.9/112.2/112.4 (median 112.30) -- within
// run-to-run noise, same conclusion as Lion (autoexec-mini-intel.cfg):
// free on this class. Turned on.
//
// Remaining headroom not yet spent, needs its own A/B before shipping:
// vid_fsaa (this GPU is ARB_multisample capable, unlike GMA 950 -- test
// via boot-time -fsaa like the G5, not a live vid_restart), decal cap,
// r_shadow_distance tuning, emissive lights, gl_clear 0.

r_oldwater 1
r_lerplightstyles 1
gl_texture_anisotropy 16
r_shadows 1
gl_texturemode "GL_LINEAR_MIPMAP_LINEAR"
gl_texture_lodbias 0

host_maxfps 72
host_framerate 0
host_timescale 0

volume 0.7
bgmvolume 1.0

viewsize 100
vid_desktopfullscreen 1
vid_width 1024
vid_height 768
vid_fullscreen 1
vid_restart

bind LEFTARROW +moveleft
bind RIGHTARROW +moveright
bind a +moveleft
bind d +moveright
bind F12 screenshot_desktop
+mlook

gl_aliasstate_cache 1

r_wateralpha 0.6
r_lavaalpha 0.6
r_telealpha 0.6
r_slimealpha 0.6
