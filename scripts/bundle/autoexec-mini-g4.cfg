// G4 mini — initial config. Added 2026-05-08 alongside the existing
// g4 (Quicksilver) target. Same arch (PPC AltiVec, Tiger 10.4) so we
// inherit the Quicksilver tuning as a starting point, then diverge if
// the bench data shows the GPU class (Radeon 9200 / GMA on later
// minis) or the lower clock (1.25-1.5 GHz vs Quicksilver's 867 MHz)
// pushes us past the playability floor on any cell.
//
// Mac mini G4s ran 1.25, 1.42, or 1.5 GHz 7447A/7447B — substantially
// faster CPU than the Quicksilver but with a noticeably weaker GPU
// (Radeon 9200 / 32 MB instead of Radeon 9000 / 64 MB; or in the
// Intel-graphics late minis, GMA 950 which we already test on Lion).
// Bench data will tell us whether this skews CPU-bound (good news,
// the visuals stack stays the same as Quicksilver) or fillrate-bound
// (we'll need to back off anisotropy/shadows).

gl_texture_anisotropy 16
r_oldwater 0

// PPC port -- finding #5: r_lerplightstyles interpolates the 10Hz
// lightstyle step so torches/pulsing lights ramp smoothly (hard
// flicker stays sharp via the engine MAXDELTA guard). Radeon 9200 — bench-gated (see commit); weaker than quicksilver so confirm the floor holds.
r_lerplightstyles 1

r_shadows 1                                  // alias drop-shadow on the floor
gl_texturemode "GL_LINEAR_MIPMAP_LINEAR"     // trilinear filtering

// Pass C HIGH leverage (Round v3 Task #10): distance-gate shadows.
// Same CPU class as Quicksilver G4 so we expect a comparable win;
// the Radeon 9200 32MB is also weaker than the Quicksilver's
// Radeon 9000 64MB, so any CPU-side relief helps headroom for
// the GPU pass.
r_shadow_distance 512

r_lavaalpha 0.6
r_telealpha 0.6
r_slimealpha 0.6

// Round v5 wrap pass 2: plain water translucency. Mini-G4 is the
// weaker-GPU sibling of quicksilver; Radeon 9200 32MB has tighter
// VRAM but the shader-water uniform-read cost is identical. Stays
// well above 60 fps on the water-heavy demo2.
r_wateralpha 0.6

// Round v5 wrap pass 3 (2026-05-09): skip backbuffer clear. **+9.3%
// on demo3 1024** (67.05 → 73.30) — the biggest gl_clear 0 win on
// the whole matrix. Radeon 9200's smaller VRAM/bandwidth makes the
// redundant fill more expensive proportionally than on Quicksilver.
//
// Round v6 (2026-05-09): engine-side water rendering split keeps
// translucent water visually correct without forcing a clear.
gl_clear 0

gl_zfix 1

// Round v5 wrap pass 4 (2026-05-09): default video + HUD settings
// for manual launches via the .app icon. Without these, the engine
// falls back to vid_width 800 / vid_height 600 default and any
// stale viewsize from a prior session sticks. Setting them in
// PPC port -- Round v7 phase 2 (Tier A) emissive-fullbright lights.
// Same configuration as Quicksilver — Radeon 9200 32MB has slightly
// less VRAM than Quicksilver's 9000 64MB but the per-dlight blend cost
// is identical (both fixed-function from the engine's perspective on
// Tiger). The big round-v7 sky-state-hoist win on this exact driver
// (+42-46% on demo3) frees a lot of headroom for the emissive cost.
r_emissive_lights         1
r_emissive_lights_radius  1.0
r_emissive_lights_max     12

// autoexec ensures the bundle always presents the same way:
//   1024x768 fullscreen with the classic HUD strip.
// Note: vid_width/vid_height take effect on NEXT launch (autoexec
// runs after VID_Init, so config.cfg gets the new value at quit).
// The companion deploy step seeds id1/config.cfg directly so the
// change is visible from the very next launch.
viewsize 100
vid_width 1024
vid_height 768
vid_fullscreen 1

// === Code-review cheap win (2026-05-29): deliberately NOT applied here ===
// vid_bpp 32 would give r_shadows 1 (above) its stencil self-intersection
// mask + 24-bit depth, exactly as shipped on quicksilver. But the Radeon
// 9200 HARD-WEDGES creating the 32bpp fullscreen context: on 2026-05-29
// the boot vid_restart hung the GPU at video-mode init (qconsole stops
// before the "Video mode" line), took SSH down with it, and the machine
// auto-rebooted. quicksilver's Radeon 9000 runs the identical 32bpp path
// fine, so this is a 9200-driver-specific mode-creation hang the engine's
// graceful fallback can't catch. Gated to the engine-default 16bpp here.
// See MISTAKES.md 2026-05-29.
