// QuakeSpasm PPC defaults — G4 (733 MHz / Radeon 9000 / Tiger)
// Managed by scripts/deploy.sh — re-deploying overwrites this file.
// To keep personal cvars, put them in id1/userconfig.cfg and add
// `exec userconfig.cfg` at the bottom of this file.

// Phase 0 cvar tuning (PPC_PLAN.md). All measurable on parallel-bench.

// Anisotropic filtering: 8x is the diminishing-returns sweet spot.
// Radeon 9000 max is usually 16. Sharper distant textures, free.
gl_texture_anisotropy 8

// Keep new water (refraction): Radeon 9000 handles the framebuffer
// copy cleanly at all our test resolutions.
r_oldwater 0
