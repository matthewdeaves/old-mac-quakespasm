// G4 Phase 0 cvar tuning - managed by scripts/deploy.sh

// Phase 0: anisotropic filtering and new-water shader on by default.
// Radeon 9000 has the headroom on Tiger to spend a few percent fillrate
// on these.
gl_texture_anisotropy 8
r_oldwater 0

// r_shadows is CVAR_ARCHIVE — once set to 1 it sticks in config.cfg,
// so we must explicitly clear it here. Without this, a one-time
// `r_shadows 1` from an earlier session would persist across reboots
// and silently cost -11% at every cell, with no obvious cause to a
// future maintainer reading just the autoexec.
r_shadows 0

// Round v3 §13.6 visual upgrades attempted 2026-05-08 — both REVERTED.
// See PPC_PLAN.md §13.6 for the experiment record.
//   r_shadows 1                              → -11% across all G4 cells
//   gl_texturemode "GL_LINEAR_MIPMAP_LINEAR" → folded into the same -11%
// Plan predicted -1..-3%; actual cost was 4-10× higher. Visual gain
// (alias drop-shadow + smoothed mip transitions) wasn't worth the fps
// cost on this hardware. Stay with the GL_LINEAR_MIPMAP_NEAREST default
// and no shadows.
