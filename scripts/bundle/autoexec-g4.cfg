// G4 visual + perf tuning — managed by scripts/deploy.sh.
// This is the SHIPPING config: best visuals while staying comfortably
// above 60 fps. Flipped per the project goal pivot 2026-05-08:
// 60+ fps on G4 is "perfectly playable" so a 10-15% headline-fps cost
// for noticeable visual upgrades is in scope.

// Phase 0 — anisotropic filtering and new-water shader. Radeon 9000
// has the headroom on Tiger to spend a few percent fillrate on these.
//
// §14.3 item 2 (Pass A §3a): bumped 8 → 16. Engine clamps silently to
// `GL_MAX_TEXTURE_MAX_ANISOTROPY_EXT` if the GPU caps lower, so
// setting 16 on a hardware-8x-max GPU is a no-op. Smoke verifies whether
// the bump moves fps (it shouldn't if hardware caps at 8) and visual
// quality (sharper textures at oblique angles when looking along walls).
gl_texture_anisotropy 16
r_oldwater 0

// §13.6 visual upgrades (Round v3, 2026-05-08).
//
// First pass tried r_shadows 1 + GL_LINEAR_MIPMAP_LINEAR together
// and reverted at -11..-12% across all G4 cells (well over the
// plan's predicted -1..-3%). The user's reframe of the project goal
// is that anything ≥60 fps on G4 is perfectly playable, so this
// drop is *acceptable* in exchange for the visual upgrade. Final
// G4 numbers with both ON: demo1 1024≈106 fps, demo3 1024≈81 fps,
// demo3 640≈94 fps — all above 60. RE-ENABLED.
//
// Each cvar can be flipped at runtime in console (`r_shadows 0`,
// `gl_texturemode "GL_LINEAR_MIPMAP_NEAREST"`) for end-of-round
// tuning experiments without a redeploy.

r_shadows 1                                  // alias drop-shadow on the floor
gl_texturemode "GL_LINEAR_MIPMAP_LINEAR"     // trilinear filtering

// Pass B revive B3 (§14.3 follow-up).
//
// Translucent liquid surfaces (lava, teleporters, slime). Engine
// default 0 = opaque; 0.6 = subtly see-through, showing the volume
// underneath. Visual upgrade with negligible fps cost on Radeon 9000
// because liquid surface area is small.
r_lavaalpha 0.6
r_telealpha 0.6
r_slimealpha 0.6

// gl_zfix 1 — z-fighting fix for coincident surfaces. Engine-wide
// cost is zero if no surfaces actually fight; revive default-on so
// any custom map that needs it gets the fix without per-map config.
gl_zfix 1
