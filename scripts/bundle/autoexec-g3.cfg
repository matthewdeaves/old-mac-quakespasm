// G3 cvar tuning — managed by scripts/deploy.sh

// r_oldwater 1 = always classic warped water. Phase 0 used 2 (auto:
// classic above 640x480, new at/below) because the demo1 640 numbers
// showed neither path winning on perf (-0.8%, noise). But interactive
// play at 640 surfaced what we missed: the Rage 128 framebuffer-copy
// refraction tint bug fires at 640 too — water flickers bright blue.
// Fix is to never use new water on G3: classic warp is correct at
// every resolution, costs nothing extra, and tessellated UV
// displacement looks fine on R128.
r_oldwater 1

// r_particles 2 = square particles (CPU-cheaper than triangle splats).
// Phase 0 measurement: helps slightly on R128, no visual difference at
// distance.
r_particles 2
