// QuakeSpasm PPC defaults — G3 (449 MHz / Rage 128 / Panther)
// Managed by scripts/deploy.sh — re-deploying overwrites this file.
// To keep personal cvars, put them in id1/userconfig.cfg and add
// `exec userconfig.cfg` at the bottom of this file.

// Phase 0 cvar tuning (PPC_PLAN.md). All measurable on parallel-bench.

// Water rendering: 2 = auto (classic above 640x480, new at/below).
// At 1024x768 the Rage 128's screen-copy refraction misbehaves and
// produces a bright-blue tint over water surfaces — auto mode dodges
// it by falling back to classic warped water at high res, while
// keeping the prettier refraction at 640x480 where it works.
r_oldwater 2

// Classic (square) particles instead of round: cuts overdraw on the
// Rage 128, which is fillrate-bound at any res. Visual cost is small.
r_particles 2
