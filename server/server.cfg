// QuakeSpasm dedicated server configuration.
//
// This file has to live in the GAME directory, next to the pak files, as
// id1/server.cfg, and it is read because the launch line says
// `+exec server.cfg`. Quake's `exec` searches the game directory, not the
// directory the binary sits in, so a copy left beside quakespasm-server is
// silently never read.
//
// Read once at startup. Anything here can also be typed on the server console
// while it runs, see README.md for how to reach that console.
//
// The player limit is NOT set here. It is the number after -dedicated on the
// command line, because NetQuake fixes it before this file is read.

// ---------------------------------------------------------------- identity
hostname "Quake"

// ----------------------------------------------------------------- privacy
//
// NetQuake has no password and no rcon. There is no way to make this server
// ask a joining player for anything, so "private" here means two things only:
// it is not advertised anywhere, and the firewall decides who can reach it.
//
// sv_public 0 is already the default. It is set explicitly because it is the
// single line that keeps this server off the public listings, and a default is
// a thing that can change under you when the engine is updated.
sv_public 0

// Belt and braces: with sv_public 0 these are never contacted, but blanking
// them means an accidental `sv_public 1` still announces to nobody.
net_masterextra1 ""
net_masterextra2 ""
net_masterextra3 ""

// -------------------------------------------------------------- match rules
deathmatch 1
coop 0
teamplay 0

fraglimit 20
timelimit 15

// 0: rotate to the next level when the limit is hit.
// 1: restart the same level. 2: same, and keep everyone's weapons.
samelevel 0

// Stop a player ending the level for everyone by walking into the exit.
noexit 0

// ------------------------------------------------------------------ comfort
// Nobody can pause a server that other people are playing on.
pausable 0

// Vertical auto-aim. 1 disables it, which is what anyone used to a mouse
// wants. Lower values make it progressively more forgiving.
sv_aim 1

// How long a silent client is kept before it is dropped, in seconds. The
// default of 300 is generous over the internet, which is the point: a vintage
// Mac on a slow link should not be dropped for a brief stall.
net_messagetimeout 300

// -------------------------------------------------------------- first level
// The map the server comes up on. Change it here to change what a restart
// lands on, or use the console to switch level while it is running.
map e1m1
