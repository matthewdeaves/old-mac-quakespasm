name: macOS

on: [push, pull_request]

# Builds the way this port actually ships: Quake/Makefile.darwin, the same
# makefile and flags scripts/build-arm64.sh uses. The previous job drove
# MacOSX/QuakeSpasm.xcodeproj, which is upstream's project file and does not
# list this port's own sources (gl_emissive.c, r_decals.c, cl_download.c), so
# it could only ever have gone green by not building them.
#
# PowerPC and the fat binary are deliberately NOT here. Those need the Lion
# cross-build minis and real hardware; scripts/build-fat.sh owns that. This job
# answers one question: does the current source still compile on a stock macOS
# toolchain.

jobs:
  build-mac-os:
    name: Build macOS (arm64)
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4

    - name: Build arm64 via Makefile.darwin
      run: |
        make -f Makefile.darwin --directory=Quake --jobs=3 \
          MACH_TYPE=arm64 \
          USE_SDL2=1 \
          CC=clang \
          QS_PORT_VERSION=ci \
          CPUFLAGS="-arch arm64 -mmacosx-version-min=11.0 -O2" \
          LDFLAGS="-arch arm64 -mmacosx-version-min=11.0" \
          SDL_FRAMEWORK_PATH=../MacOSX

    - name: Confirm it produced an arm64 binary
      run: |
        file Quake/quakespasm
        lipo -archs Quake/quakespasm | grep -qw arm64
